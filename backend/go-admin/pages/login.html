<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVT Reco Admin -- Logowanie</title>
    
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="/static/js/theme.js?v=7"></script>
</head>
<body>

{{if .Error}}
<div class="toast">Nieprawidłowy login lub hasło</div>
{{end}}

<div class="login-card{{if .Error}} shake{{end}}">
    <div class="login-logo">
        <span class="logo-mvt">MVT</span>
        <span class="logo-sub">Reco Admin</span>
    </div>
    <form method="POST" action="/login">
        
        <div class="form-group">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" required
                   autocomplete="username" placeholder="Użytkownik admin panelu">
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Zaloguj się</button>
        
        <p style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-secondary); text-align: center;">
            Uwaga: Login/Hasło panelu mvt reco admin jest RÓŻNY od danych głównej strony!
        </p>
    </form>
</div>

<script src="/static/js/login.js"></script>
{{if .Error}}
<script>
    handleLoginError();
</script>
{{end}}

</body>
</html>
