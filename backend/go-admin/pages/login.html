<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVT Reco Admin -- Logowanie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --secondary: #3498db;
    --accent: #e74c3c;
    --bg: #1a1a1a;
    --surface: #2c2c2c;
    --text: #ffffff;
    --text-sec: #cccccc;
    --border: #404040;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --radius: 10px;
    --transition: all 0.3s ease;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

.login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
}

.login-logo {
    text-align: center;
    margin-bottom: 2rem;
}

.logo-mvt {
    display: block;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--secondary);
    letter-spacing: 0.08em;
}

.logo-sub {
    display: block;
    font-size: 0.9rem;
    color: var(--text-sec);
    margin-top: 0.25rem;
    font-weight: 500;
}

.form-group {
    margin-bottom: 1.2rem;
}

label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-sec);
    margin-bottom: 0.35rem;
    font-weight: 500;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.9rem;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    transition: var(--transition);
}

input:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
}

.btn-login {
    width: 100%;
    padding: 0.75rem;
    background: var(--secondary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 0.5rem;
}

.btn-login:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}

/* Toast */
.toast {
    position: fixed;
    top: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: #fff;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    opacity: 0;
    animation: toastIn 0.3s ease forwards, toastOut 0.4s ease 2.8s forwards;
    z-index: 999;
    white-space: nowrap;
}

@keyframes toastIn  { to   { opacity: 1; } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* Shake na karcie przy błędzie */
.shake {
    animation: shake 0.4s ease;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-8px); }
    40%       { transform: translateX(8px); }
    60%       { transform: translateX(-5px); }
    80%       { transform: translateX(5px); }
}

/* Czerwona ramka na polach przy błędzie */
.input-error {
    border-color: var(--accent) !important;
}
</style>
</head>
<body>

{{if .Error}}
<div class="toast">Nieprawidłowy login lub hasło</div>
{{end}}

<div class="login-card{{if .Error}} shake{{end}}">
    <div class="login-logo">
        <span class="logo-mvt">MVT</span>
        <span class="logo-sub">Reco Admin</span>
    </div>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" required
                   autocomplete="username" placeholder="Nazwa użytkownika">
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Zaloguj się</button>
    </form>
</div>

{{if .Error}}
<script>
    // Wyczyść pole hasła i zaznacz pola jako błędne
    const pwd = document.getElementById('password');
    const usr = document.getElementById('username');
    if (pwd) { pwd.value = ''; pwd.classList.add('input-error'); }
    if (usr) { usr.classList.add('input-error'); }
    // Usuń czerwoną ramkę przy nowym focusie
    [pwd, usr].forEach(el => {
        if (el) el.addEventListener('focus', () => el.classList.remove('input-error'), { once: true });
    });
    if (pwd) pwd.focus();
</script>
{{end}}

</body>
</html>
