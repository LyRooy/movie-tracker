<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MVT Reco Admin — Dashboard</title>
    
    <link rel="stylesheet" href="/static/css/dashboard.css?v=4">
    <script src="/static/js/theme.js?v=5"></script>
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <div class="nav-logo">
            <span class="logo-mvt">MVT</span>
            <span class="logo-sub">Reco Admin</span>
        </div>
        <form method="POST" action="/logout">
            <button type="submit" class="btn-logout">Wyloguj</button>
        </form>
    </div>
</nav>

<main class="main">
    <div class="container">

        <div class="card">
            <div class="card-header">Status połączenia z silnikiem rekomendacji</div>
            <div class="status-row">
                <span class="status-dot online"></span>
                <span>Python FastAPI &mdash; <strong>Online</strong></span>
            </div>
        </div>

        <div class="card terminal-card">
            <div class="card-header">Terminal Logów (Live)</div>
            <div class="log-panel" id="log-panel">
                <div class="log-entry info"><span class="log-time">--:--:--</span><span class="log-model">[SYS]</span><span class="log-level">INFO</span><span class="log-msg">Czekanie na zdarzenia AI...</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Wyniki wysłane do bazy danych</div>
            <div class="result-grid">
                <div>
                    <div class="progress-label">
                        <span>Collaborative Filtering</span>
                        <span id="cf-status" class="status-value">oczekuje</span>
                    </div>
                    <div class="progress-track">
                        <div id="cf-fill" class="progress-fill"></div>
                    </div>
                    <div class="loss-row">
                        <span class="loss-label">Rekomendacje:</span>
                        <span id="cf-count" class="loss-value">0</span>
                    </div>
                </div>
                <div>
                    <div class="progress-label">
                        <span>Content-Based</span>
                        <span id="cb-status" class="status-value">oczekuje</span>
                    </div>
                    <div class="progress-track">
                        <div id="cb-fill" class="progress-fill"></div>
                    </div>
                    <div class="loss-row">
                        <span class="loss-label">Rekomendacje:</span>
                        <span id="cb-count" class="loss-value">0</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="/static/js/dashboard.js?v=5"></script>

</body>
</html>
