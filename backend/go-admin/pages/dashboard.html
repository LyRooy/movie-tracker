<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVT Reco Admin — Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --secondary: #3498db;
    --accent: #e74c3c;
    --bg: #1a1a1a;
    --surface: #2c2c2c;
    --text: #ffffff;
    --text-sec: #cccccc;
    --border: #404040;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --radius: 10px;
    --transition: all 0.3s ease;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
}

/* Navbar */
.navbar {
    background: var(--surface);
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 100;
}

.nav-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1.5rem;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.nav-logo {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
}

.logo-mvt {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--secondary);
    letter-spacing: 0.05em;
}

.logo-sub {
    font-size: 0.85rem;
    color: var(--text-sec);
    font-weight: 500;
}

.btn-logout {
    padding: 0.45rem 1rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
}

.btn-logout:hover { opacity: 0.85; }

/* Main */
.main { padding: 2rem 1rem; }

.container {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
}

/* Card */
.card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    box-shadow: var(--shadow);
}

.card-header {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-sec);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
}

/* Status */
.status-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.95rem;
}

.status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}

.status-dot.online  { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
.status-dot.offline { background: var(--accent); }

/* Progress */
.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-sec);
    margin-bottom: 0.5rem;
}

.progress-track {
    background: #111;
    border-radius: 999px;
    height: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--secondary), #2ecc71);
    border-radius: 999px;
    transition: width 0.4s ease;
    width: 0%;
}

.loss-row {
    margin-top: 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.loss-label { color: var(--text-sec); font-size: 0.9rem; }
.loss-value { font-size: 1.1rem; font-weight: 700; color: var(--secondary); }
</style>
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <div class="nav-logo">
            <span class="logo-mvt">MVT</span>
            <span class="logo-sub">Reco Admin</span>
        </div>
        <form method="POST" action="/logout">
            <button type="submit" class="btn-logout">Wyloguj</button>
        </form>
    </div>
</nav>

<main class="main">
    <div class="container">

        <div class="card">
            <div class="card-header">Status silnika AI</div>
            <div class="status-row">
                <span class="status-dot online"></span>
                <span>Python FastAPI &mdash; <strong>Online</strong></span>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Postęp trenowania modelu</div>
            <div class="progress-label">
                <span>Ukończono</span>
                <span id="progress-pct">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress" class="progress-fill"></div>
            </div>
            <div class="loss-row">
                <span class="loss-label">Strata (Loss):</span>
                <span id="loss-val" class="loss-value">---</span>
            </div>
        </div>

    </div>
</main>

<script>
    const ws = new WebSocket("wss://" + window.location.host + "/ws/progress");
    ws.onmessage = function(event) {
        const data = JSON.parse(event.data);
        const pct = data.percent + "%";
        document.getElementById("progress").style.width = pct;
        document.getElementById("progress-pct").innerText = pct;
        document.getElementById("loss-val").innerText = data.loss;
    };
    ws.onclose = function() {
        console.warn("WebSocket rozłączony.");
    };
</script>

</body>
</html>
