<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MVT Reco Admin -- Logowanie</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --secondary: #3498db;
    --accent: #e74c3c;
    --bg: #1a1a1a;
    --surface: #2c2c2c;
    --text: #ffffff;
    --text-sec: #cccccc;
    --border: #404040;
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    --radius: 10px;
    --transition: all 0.3s ease;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}

.login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow);
}

.login-logo {
    text-align: center;
    margin-bottom: 2rem;
}

.logo-mvt {
    display: block;
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--secondary);
    letter-spacing: 0.08em;
}

.logo-sub {
    display: block;
    font-size: 0.9rem;
    color: var(--text-sec);
    margin-top: 0.25rem;
    font-weight: 500;
}

.form-group {
    margin-bottom: 1.2rem;
}

label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-sec);
    margin-bottom: 0.35rem;
    font-weight: 500;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 0.65rem 0.9rem;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    transition: var(--transition);
}

input:focus {
    outline: none;
    border-color: var(--secondary);
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
}

.btn-login {
    width: 100%;
    padding: 0.75rem;
    background: var(--secondary);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 0.5rem;
}

.btn-login:hover {
    opacity: 0.85;
    transform: translateY(-1px);
}
</style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <span class="logo-mvt">MVT</span>
        <span class="logo-sub">Reco Admin</span>
    </div>
    <form method="POST" action="/login">
        <div class="form-group">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" required
                   autocomplete="username" placeholder="Nazwa użytkownika">
        </div>
        <div class="form-group">
            <label for="password">Hasło</label>
            <input type="password" id="password" name="password" required
                   autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-login">Zaloguj się</button>
    </form>
</div>
</body>
</html>
